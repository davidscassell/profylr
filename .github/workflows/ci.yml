name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build the source tarball
        run: R CMD build .
      - name: R CMD check the tarball
        run: R CMD check --no-manual profylr_*.tar.gz
      - name: Install the tarball outside the checkout
        run: |
          lib="${RUNNER_TEMP}/profylr-lib"
          mkdir -p "$lib"
          R CMD INSTALL -l "$lib" profylr_*.tar.gz
          echo "PROF_LIB=$lib" >> "$GITHUB_ENV"
      - name: Run the tests against that install
        run: |
          Rscript -e 'lib <- Sys.getenv("PROF_LIB"); .libPaths(c(lib, .libPaths())); stopifnot(normalizePath(dirname(find.package("profylr"))) == normalizePath(lib)); testthat::test_dir("tests/testthat", package = "profylr", load_package = "installed")'
